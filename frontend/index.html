<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concesionaria</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <h1>Autos Concesionaria</h1>
        </div>
        <nav class="main-nav">
            <a href="#">Inicio</a>
            <a href="#">Catálogo</a>
            <a href="#">Marcas</a>
            <a href="#">Contacto</a>
        </nav>
    </header>
    
    <main>
        <section class="hero">
            <h1>Encontrá tu próximo auto</h1>
            <p>Modelos seleccionados, garantía oficial y atención personalizada.</p>
            <a href="#catalogo" class="button-primary">Ver Catálogo</a>
        </section>
        
        <section class="catalog" id="catalogo">
            <h2>Vehículos Destacados</h2>
            <div class="search-container">
                <input type="text"
                id="search-input"
                placeholder="Buscar por marca o modelo (ej. Ferrari, Chevrolet)...">
            </div>
            <div class="cars-grid" id="cars-grid">
                <!-- Espaciado para las tarjetas dinámicas -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Autos Concesionaria. Todos los derechos reservados.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
